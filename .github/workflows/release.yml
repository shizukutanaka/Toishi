name: Release

# Tag a release (v*) to build binaries for the main desktop OSes and
# attach them, with checksums, to a GitHub Release. A manual
# workflow_dispatch run only builds and uploads Actions artifacts;
# it never creates a Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Determine version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            echo "VERSION=v${v}-snapshot.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="toishi-${VERSION}-${{ matrix.target }}"
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/toishi" staging/
          cp README.md LICENSE staging/
          tar -czf "dist/${name}.tar.gz" -C staging .
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "toishi-$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Force dist, staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/toishi.exe" staging/
          Copy-Item README.md, LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath "dist/${name}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/${name}.zip").Hash.ToLower()
          "${hash}  ${name}.zip" | Out-File -Encoding ascii "dist/${name}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toishi-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: toishi-*
          merge-multiple: true

      - name: Combine checksums and create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat dist/*.sha256 > SHA256SUMS.txt
          rm dist/*.sha256
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip SHA256SUMS.txt
